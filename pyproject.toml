[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantem.widget"
version = "0.0.1rc30"
description = "Interactive custom Python widgets for electron microscopy"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "quantem>=0.1.8",
    "quantem.gpu>=0.0.1rc4",
    "anywidget>=0.11.0",
    # JupyterLab widget manager 5.0.10 restores saved metadata.widgets state on reopen.
    "jupyterlab_widgets>=3.0.10",
    "numpy>=2.0.0",
    "traitlets>=5.0.0",
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
    "Pillow>=10.0.0",
    "numba>=0.60",
    "xraydb>=4.5.0",
    "sparse>=0.15.0",
    "imagecodecs>=2024.1.1",  # decode compressed (e.g. LZW) TIFF frames for show3d / read_image_stack
    # Apple Metal backend on macOS (tiny wheel, no system toolkit). On Linux the CUDA
    # decode uses cupy, but we do NOT pin a cupy wheel: a fixed cuda13x/cuda12x would
    # collide with a cupy the environment already ships (Colab pre-installs cupy-cuda12x ->
    # "multiple CuPy packages" warning + breakage). A real CUDA workflow already has the
    # matching cupy; if not, the GPU-only decode path (kernels.detect()) raises with the
    # exact install command. Widget display itself still routes cuda > mps > cpu via
    # detect_backend(). So pip install stays one line without a cupy conflict.
    "pyobjc-framework-Metal>=10.0 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Shared HF dataset hub (upload/download), re-exported by quantem.widget.io.hub
# Not published on PyPI yet so cannot be a hard depedency
# pip install quantem.widget[hub] once available
hub = ["quantem.data>=0.0.1rc1"]
test = [
    "pytest>=8",
    "nbconvert>=7",
]

[project.scripts]
quantem = "quantem.widget.cli:main"
qw = "quantem.widget.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantem"]
artifacts = ["src/quantem/widget/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/quantem/widget/static/**"]
