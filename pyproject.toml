[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantem.widget"
version = "0.0.1rc39"
description = "Interactive custom Python widgets for electron microscopy"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # Every widget on every platform. torch 2.2 is the newest wheel for Intel Macs, and
    # torch 2.2 imports only with numpy 1.x there, hence the marker.
    "torch>=2.2",
    "numpy>=1.26",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "anywidget>=0.11.0",
    "ipywidgets>=7.6",  # Show1D's prepared view, export_html's embedding (anywidget's own floor)
    "comm>=0.1.3",  # Show3D's saved-notebook preview renders without a frontend model (ipywidgets' own floor)
    "ipython>=6.1",  # notebook display of the saved-notebook preview (ipywidgets' own floor)
    # JupyterLab widget manager 5.0.10 restores saved metadata.widgets state on reopen.
    "jupyterlab_widgets>=3.0.10",
    "traitlets>=5.0.0",
    "tornado>=6.1",  # Show4DSTEM schedules its first view sync on the kernel's IOLoop
    "Pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "scikit-image>=0.22",  # ShowDiffraction denoise="nlm" (non-local means)
    "h5py>=3.8",  # Show4DSTEM dense reader, EMD images
    # bitshuffle-LZ4 detector files. Windows on ARM has no wheel and the sdist needs MSVC, so it
    # is skipped there (x64 Python on Windows on ARM also reports ARM64); the reader names it
    # when a file needs it.
    "hdf5plugin>=4.1; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "psutil>=5.9",  # Show4DSTEM dense reader memory ceiling
    "tifffile>=2024.1.1",  # read_image_stack / Show3D folder frames
    "imagecodecs>=2024.1.1",  # tifffile codec plugin for compressed (e.g. LZW) TIFF frames
    # read_image .dm3/.dm4. ncempy 1.15+ requires and imports hdf5plugin; 1.14 reads the same
    # .dm3/.dm4 files without it, so Windows on ARM takes 1.14.
    "ncempy>=1.11; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "ncempy>=1.11,<1.15; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "huggingface_hub>=0.25",  # tutorial datasets and io.download
    # quantem core: readers return its Dataset2d/Dataset3d/Dataset4dstem. It needs torch 2.7 and
    # NumPy 2 (no Intel Mac wheel) and hdf5plugin 6 (no Windows on ARM wheel); there the widget's
    # stand-in carries the same attributes (adapters/core.py).
    "quantem>=0.1.9; (sys_platform != 'darwin' or platform_machine != 'x86_64') and (sys_platform != 'win32' or platform_machine != 'ARM64')",
    "ase>=3.22",  # ShowCIF reads crystal structures
]

[project.optional-dependencies]
# The same explicit extras as quantem.gpu, which adds encoded GPU acquisitions and GPU file
# loading. [cuda]: NVIDIA (CuPy). [mps]: Apple silicon (Metal, MLX). [cpu]: no GPU, or an Intel
# Mac, which cannot install quantem.gpu (torch 2.3+). A wrong pick installs nothing harmful.
cpu = []
cuda = ["quantem.gpu[cuda]>=0.0.1rc13; sys_platform != 'darwin'"]
mps = ["quantem.gpu[mps]>=0.0.1rc13; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Uploading new tutorial datasets to the shared Hugging Face hub (downloads need
# only huggingface_hub). quantem.data is not on PyPI, so it stays an extra.
hub = ["quantem.data>=0.0.1rc1"]
# ShowCIF(potential=True) projects atoms with abTEM's Lobato parametrization
crystal = ["abtem>=1.0"]
test = [
    "ipykernel>=6",
    "pytest>=8",
    "nbconvert>=7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
quantem = "quantem.widget.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/quantem"]
artifacts = ["src/quantem/widget/static/**", "src/quantem/widget/vendor/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/quantem/widget/static/**", "src/quantem/widget/vendor/**"]
