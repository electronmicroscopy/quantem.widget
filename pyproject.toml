[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantem.widget"
version = "0.0.1rc25"
description = "Interactive custom Python widgets for electron microscopy"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "quantem>=0.1.8",
    "quantem.data>=0.0.1",   # shared HF dataset hub (upload/download), re-exported by io.hub
    "anywidget>=0.9.0",
    "numpy>=2.0.0",
    "traitlets>=5.0.0",
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
    "Pillow>=10.0.0",
    "numba>=0.60",
    "imagecodecs>=2024.1.1",  # decode compressed (e.g. LZW) TIFF frames for show3d / read_image_stack
    # Apple Metal backend on macOS (tiny wheel, no system toolkit). On Linux the CUDA
    # decode uses cupy, but we do NOT pin a cupy wheel: a fixed cuda13x/cuda12x would
    # collide with a cupy the environment already ships (Colab pre-installs cupy-cuda12x ->
    # "multiple CuPy packages" warning + breakage). A real CUDA workflow already has the
    # matching cupy; if not, detect_backend() raises with the exact install command (never
    # a silent CPU fallback). So pip install stays one line without a cupy conflict.
    "pyobjc-framework-Metal>=10.0 ; sys_platform == 'darwin'",
]

[project.scripts]
quantem = "quantem.widget.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantem"]
artifacts = ["src/quantem/widget/static/**"]
