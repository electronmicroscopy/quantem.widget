# Jupyter Book 1.x config for the quantem.widget docs site.
# Tutorial notebooks are EXECUTED at build time ("force"): tutorial data
# downloads from Hugging Face and myst-nb bakes the resulting widget state into
# the HTML, so the published widgets stay interactive without a Python kernel. Committed
# notebooks carry no baked state (repo stays small). "force" (not "cache") is
# deliberate: jupyter-cache does not preserve metadata.widgets, which would
# silently blank every widget. Building locally needs the package installed
# with data extras and `npm run build` done first (see widget-docs.yml).
title: quantem.widget
author: ""
logo: ""
only_build_toc_files: true
exclude_patterns:
  - "**/._*"

execute:
  execute_notebooks: "force"
  timeout: 900

# Embedded anywidget views need the ipywidgets HTML manager in the static page.
# myst-nb writes the widget state baked into each notebook; this pulls the JS
# runtime that rehydrates it so the published widgets stay interactive without a Python kernel.
sphinx:
  config:
    # Jupyter Book's defaults without sphinx-thebe: no page offers a live
    # kernel, and its inline config script loads twice, so every page threw
    # "Identifier 'THEBE_JS_URL' has already been declared".
    extensions:
      - sphinx_togglebutton
      - sphinx_copybutton
      - myst_nb
      - jupyter_book
      - sphinx_comments
      - sphinx_external_toc
      - sphinx.ext.intersphinx
      - sphinx_design
      - sphinx_book_theme
      - sphinx.ext.autodoc
      - sphinx.ext.napoleon
    # A tutorial that errors must fail the docs build, not publish a half-blank page.
    nb_execution_raise_on_error: true
    # Links such as show4dstem.md#live-scope-folders resolve to the heading,
    # the same anchor GitHub renders for the source file.
    myst_heading_anchors: 2
    # napoleon parses the NumPy-style docstrings into Parameters / Returns field lists.
    napoleon_numpy_docstring: true
    napoleon_google_docstring: false
    napoleon_use_param: true
    napoleon_use_rtype: true
    autodoc_member_order: "bysource"
    autoclass_content: "both"
    # autodoc imports the package; CuPy is not on the runner, so it and the
    # optional readers are mocked. torch, numpy and quantem core are installed
    # in the docs build step.
    autodoc_mock_imports:
      - anywidget
      - cupy
      - h5py
      - hdf5plugin
      - tifffile
      - ncempy
      - huggingface_hub
    suppress_warnings:
      - "etoc.toctree"
    # No in-page Contents sidebar: the pages showcase wide interactive
    # widgets, so the article column gets every horizontal pixel.
    html_theme_options:
      secondary_sidebar_items: []
    html_static_path:
      - "_static"
    html_extra_path:
      - "_extra"
    html_css_files:
      - custom.css
    html_js_files:
      # Keeps the mobile hamburger wired across sphinx theme drift; the file
      # is idempotent so double-inclusion via _static auto-add is harmless.
      - nav-toggle-fix.js
    # Jupyter Book already injects the ipywidgets html-manager that rehydrates the
    # baked anywidget views, so we do NOT add our own embed-amd: a second manager
    # mounts every widget twice. (Confirmed: removing this kills the double render.)
    copyright: "2026, ophusgroup"

html:
  use_issues_button: false
  use_repository_button: true
  home_page_in_navbar: false

repository:
  url: https://github.com/electronmicroscopy/quantem.widget
  path_to_book: docs
  branch: main
