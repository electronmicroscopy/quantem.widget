# Jupyter Book 1.x config for the quantem.widget docs site.
# Tutorial notebooks are EXECUTED at build time ("force"): tutorial data
# downloads from Hugging Face and myst-nb bakes the resulting widget state into
# the HTML, so the published widgets stay interactive offline. Committed
# notebooks carry no baked state (repo stays small). "force" (not "cache") is
# deliberate: jupyter-cache does not preserve metadata.widgets, which would
# silently blank every widget. Building locally needs the package installed
# with data extras and `npm run build` done first (see widget-docs.yml).
title: quantem.widget
author: Sangjoon Bob Lee, et al
logo: ""
only_build_toc_files: true
exclude_patterns:
  - "**/._*"

execute:
  execute_notebooks: "force"
  timeout: 900

# Embedded anywidget views need the ipywidgets HTML manager in the static page.
# myst-nb writes the widget state baked into each notebook; this pulls the JS
# runtime that rehydrates it so the published widgets stay interactive offline.
sphinx:
  extra_extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.napoleon
  config:
    # A tutorial that errors must fail the docs build, not publish a half-blank page.
    nb_execution_raise_on_error: true
    # napoleon parses the NumPy-style docstrings into proper Parameters / Returns
    # field lists (autodoc2's raw render flattened them into a wall of text).
    napoleon_numpy_docstring: true
    napoleon_google_docstring: false
    napoleon_use_param: true
    napoleon_use_rtype: true
    autodoc_member_order: "bysource"
    autoclass_content: "both"
    # autodoc imports the package; the CPU-only runner has no torch/cupy/numba, so
    # mock the heavy + native deps. The pure-python deps (anywidget, traitlets,
    # numpy, quantem core) are installed in the docs build step.

    # quantem.data is optional (not on PyPI)
    # mock it so autodoc can still import quantem.widget.io.hub to
    # document list_datasets and download
    autodoc_mock_imports:
      - anywidget
      - quantem.data
      - cupy
      - cupyx
      - h5py
      - hdf5plugin
      - tifffile
      - ncempy
      - huggingface_hub
      - Metal
      - objc
      - Foundation
      - Quartz
    suppress_warnings:
      - "etoc.toctree"
    # Drop the right-hand in-page "Contents" sidebar so wide widgets get the
    # full column. custom.css enforces this and full-width article too.
    html_theme_options:
      secondary_sidebar_items: []
    html_static_path:
      - "_static"
    html_extra_path:
      - "_extra"
    html_css_files:
      - custom.css
    # Jupyter Book already injects the ipywidgets html-manager that rehydrates the
    # baked anywidget views, so we do NOT add our own embed-amd: a second manager
    # mounts every widget twice. (Confirmed: removing this kills the double render.)
    copyright: "2026, ophusgroup"

html:
  use_issues_button: false
  use_repository_button: true
  home_page_in_navbar: false

repository:
  url: https://github.com/bobleesj/quantem
  path_to_book: widget/docs
  branch: widget-show3d-show4dstem-kernels
