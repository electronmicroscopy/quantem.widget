# Table of contents. The widgets migrated onto this branch are documented in
# two sections: hands-on Tutorials, and an exhaustive API Reference that doubles
# as a UI-test spec for automated agents.
format: jb-book
root: intro
parts:
  - caption: Getting started
    chapters:
      - file: install
      - file: tutorials/demo
        title: Interactive demo route
      - file: cli
      - file: agent-prompts
        title: Agent-assisted development
  # Show4DSTEM and ShowPtycho lead: they are the flagship workflows.
  - caption: Tutorials
    chapters:
      - file: tutorials/download_data
      - file: tutorials/contribute_data
        title: Contribute tutorial data
      - file: tutorials/show4dstem
        sections:
          - file: tutorials/show4dstem_single
            title: Open one 4D-STEM dataset
          - file: tutorials/show4dstem_multiple
            title: Compare datasets or tilts
      - file: tutorials/showptycho
      - file: tutorials/show1d
      - file: tutorials/plot2d
      - file: tutorials/show2d
      - file: tutorials/show3d
      - file: tutorials/show3dslices
      - file: tutorials/showdiffraction
      - file: tutorials/choose_lattice
        title: Choose Lattice
      - file: tutorials/showcif
        title: ShowCIF
      - file: tutorials/io_gpu
        title: IO/GPU
  - caption: Exporting
    chapters:
      - file: tutorials/show4dstem_export
        title: Show4DSTEM export
      - file: tutorials/showptycho_export
      - file: tutorials/widget_export
  # Advanced and Maintainers are each one expandable parent link (chevron) so
  # the sidebar stays short. These parts deliberately have NO caption: the
  # parent link is the label, and a caption would render a duplicate header
  # right above it.
  - chapters:
      - file: tutorials/advanced
        title: Advanced
        sections:
          - file: tutorials/show2d_advanced
            title: Advanced Show2D
          - file: tutorials/memory_management
            title: Memory management
          - file: tutorials/watch_folder
            title: Live folder watching
          - file: tutorials/compare_reconstructions
            title: Comparing reconstructions
  # API reference lives under Developers, separate from the tutorials.
  - caption: Developers
    chapters:
      - file: api/index
        title: API reference
        sections:
          - file: api/datasets
          - file: api/viewer-ui
          - file: api/show1d
          - file: api/plot2d
          - file: api/show2d
          - file: api/show3d
          - file: api/show3dslices
          - file: api/show4dstem
          - file: api/showptycho
          - file: api/showdiffraction
          - file: api/choose-lattice
          - file: api/showcif
          - file: api/html-export
          - file: api/io
          - file: api/load
      - file: developer/widget-creation
        title: Creating a widget
      - file: developer/ui-guide
        title: UI Guide
      - file: developer/experimental-ans
        title: Experimental ANS sources
      - file: developer/save-state-and-notebook-size
        title: Save state & notebook size
  - chapters:
      - file: maintainer/index
        title: Maintainer guide
        sections:
          - file: maintainer/pull-requests
            title: Pull requests
          - file: maintainer/docs-design
            title: Docs design rules
          - file: changelog
            title: Changelog
          - file: maintainer/widget-release
            title: Release
          - file: maintainer/viewing-html-on-mobile
            title: Mobile HTML
          - file: maintainer/widget-ui-protocol
            title: UI protocol
          - file: maintainer/widget-performance
            title: Performance
