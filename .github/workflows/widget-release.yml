name: Widget release

on:
  push:
    tags:
      - "widget-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: widget-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testpypi:
    name: Build and publish quantem.widget
    runs-on: ubuntu-latest
    environment: testpypi
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: quantem-widget-release
          environment-file: environment.yml
          auto-update-conda: true
          channel-priority: strict
          conda-remove-defaults: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve widget version from tag
        id: version
        run: |
          python - <<'PY'
          import os
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"widget-v(?P<version>\d+\.\d+\.\d+(?:rc\d+|\.post\d+)?)", tag)
          if match is None:
              raise SystemExit(
                  f"Expected tag widget-vX.Y.Z, widget-vX.Y.ZrcN, or widget-vX.Y.Z.postN; got {tag!r}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={match.group('version')}", file=output)
          PY

      - name: Build frontend assets
        run: |
          npm ci
          npm run typecheck
          npm run build
          test -s src/quantem/widget/static/show2d.js
          test -s src/quantem/widget/static/show4dstem.js

      - name: Build standalone browser GUI
        working-directory: web
        run: |
          npm ci
          OFFLINE_HTML=1 npm run build
          mkdir -p ../src/quantem/widget/static/browser
          cp -R dist/. ../src/quantem/widget/static/browser/
          test -s ../src/quantem/widget/static/browser/index.html

      - name: Stamp widget package version
        env:
          WIDGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          version = os.environ["WIDGET_VERSION"]
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Expected exactly one project.version field")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Build widget distributions
        run: python -m build . --wheel --no-isolation --outdir dist/widget

      - name: Check widget distributions
        run: python -m twine check dist/widget/*

      - name: Check widget wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist/widget").glob("quantem_widget-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          wheel = wheels[0]
          required = {
              "quantem/widget/static/show2d.js",
              "quantem/widget/static/show3d.js",
              "quantem/widget/static/show3dslices.js",
              "quantem/widget/static/show4dstem.js",
              "quantem/widget/static/browser/index.html",
          }
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"{wheel} missing required files: {missing}")
          print(f"wheel ok: {wheel}")
          PY

      - name: Publish widget to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/widget/
