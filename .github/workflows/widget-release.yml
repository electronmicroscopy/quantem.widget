name: Widget release

on:
  push:
    tags:
      - "widget-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: widget-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build quantem.widget
    runs-on: ubuntu-latest
    environment: testpypi
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: quantem-widget-release
          environment-file: environment.yml
          auto-update-conda: true
          channel-priority: strict
          conda-remove-defaults: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          check-latest: true
          cache: npm
          cache-dependency-path: package-lock.json

      # gpu-ref.txt is the one quantem.gpu ref every widget build bundles
      - name: Read the pinned quantem.gpu ref
        id: gpu
        run: echo "ref=$(cat gpu-ref.txt)" >> "$GITHUB_OUTPUT"

      - name: Check out quantem.gpu browser-compute sources
        uses: actions/checkout@v7
        with:
          repository: bobleesj/quantem.gpu
          ref: ${{ steps.gpu.outputs.ref }}
          path: quantem-gpu-src

      - name: Resolve widget version from tag
        id: version
        run: |
          python - <<'PY'
          import os
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"widget-v(?P<version>\d+\.\d+\.\d+(?:rc\d+|\.post\d+)?)", tag)
          if match is None:
              raise SystemExit(
                  f"Expected tag widget-vX.Y.Z, widget-vX.Y.ZrcN, or widget-vX.Y.Z.postN; got {tag!r}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={match.group('version')}", file=output)
          PY

      - name: Build frontend assets
        env:
          QUANTEM_GPU_SRC: ${{ github.workspace }}/quantem-gpu-src/src
        run: |
          npm ci
          npm run build
          npx tsc --noEmit  # the build synced the quantem.gpu kernels; `npm run typecheck` would sync them again
          test -s src/quantem/widget/static/show2d.js
          test -s src/quantem/widget/static/show4dstem.js

      - name: Stamp widget package version
        env:
          WIDGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          version = os.environ["WIDGET_VERSION"]
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Expected exactly one project.version field")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Build widget distributions
        run: python -m build . --wheel --no-isolation --outdir dist/widget

      - name: Check widget distributions
        run: python -m twine check dist/widget/*

      - name: Check widget wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist/widget").glob("quantem_widget-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {wheels}")
          wheel = wheels[0]
          required = {
              "quantem/widget/static/scancontrol.js",
              "quantem/widget/static/diffractionsim.js",
              "quantem/widget/static/engine-manifest.json",
              "quantem/widget/static/show1d.js",
              "quantem/widget/static/plot2d.js",
              "quantem/widget/static/show2d.js",
              "quantem/widget/static/show3d.js",
              "quantem/widget/static/show3dslices.js",
              "quantem/widget/static/show4dstem.js",
              "quantem/widget/static/showpdf.js",
              "quantem/widget/static/showptycho.js",
          }
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"{wheel} missing required files: {missing}")
          print(f"wheel ok: {wheel}")
          PY

      - name: Keep the exact candidate wheel
        uses: actions/upload-artifact@v4
        with:
          name: candidate-wheel
          path: dist/widget/*.whl
          if-no-files-found: error

  hardware:
    name: Direct ptychography acceptance (${{ matrix.backend }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, mps]
    runs-on: [self-hosted, "quantem-${{ matrix.backend }}"]
    timeout-minutes: 45
    env:
      PYTHONPATH: ""
      PYTORCH_ENABLE_MPS_FALLBACK: "0"
      PYTORCH_MPS_FAST_MATH: "0"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: candidate-wheel
          path: candidate
      - name: Fresh wheel installation
        shell: bash
        run: |
          set -euo pipefail
          CHECK_ENV="$RUNNER_TEMP/direct-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.backend }}"
          python3 -m venv "$CHECK_ENV"
          echo "$CHECK_ENV/bin" >> "$GITHUB_PATH"
          WHEEL=$(find "$PWD/candidate" -name '*.whl')
          "$CHECK_ENV/bin/python" -m pip install "$WHEEL[${{ matrix.backend }}]" \
            --extra-index-url https://test.pypi.org/simple/ \
            huggingface_hub pytest playwright jupyterlab nbclient
      - name: Fetch the public benchmark acquisition
        shell: bash
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          root = snapshot_download("bobleesj/quantem-data", repo_type="dataset",
              revision="5925e4b49b2ca28ff82d6d5a6b9a8bfea9edfb20",
              allow_patterns="4dstem/gold_512/*")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              print("QUANTEM_DIRECT_RELEASE_SOURCE=" + str(Path(root) / "4dstem/gold_512/gold_004_master.h5"), file=output)
          PYCODE
      - name: Fresh-kernel ShowPtycho drawing, refitting and restore
        shell: bash
        env:
          QUANTEM_WIDGET_BROWSER: "1"
          QUANTEM_WIDGET_HEADLESS: "1"
          # the installed wheel's bundles are the release under test, not a stale build of this checkout
          QUANTEM_WIDGET_ALLOW_STALE_BUNDLE: "1"
          QUANTEM_DIRECT_RELEASE: "1"
          QUANTEM_DIRECT_RELEASE_BACKEND: ${{ matrix.backend }}
          QUANTEM_DIRECT_RELEASE_CALIBRATION: '{"semiangle_mrad":30,"scan_sampling_A":0.5,"detector_sampling_mrad":0.46}'
          QUANTEM_WIDGET_BROWSER_OUT: ${{ runner.temp }}/direct-widget-${{ matrix.backend }}
        run: python -m pytest -q -s tests/browser/test_showptycho_release.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: direct-widget-${{ matrix.backend }}
          path: |
            ${{ runner.temp }}/direct-widget-${{ matrix.backend }}/showptycho_release_*.png
            ${{ runner.temp }}/direct-widget-${{ matrix.backend }}/showptycho_release_timings.json
          if-no-files-found: error

  testpypi:
    name: Publish qualified quantem.widget
    needs: [build, hardware]
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-wheel
          path: dist/widget
      - name: Publish widget to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/widget/
