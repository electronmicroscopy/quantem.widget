# Build the quantem.widget Jupyter Book and publish it to this repository's
# GitHub Pages site. The runner EXECUTES the tutorial notebooks at build time
# (execute_notebooks: force in docs/_config.yml): tutorial data downloads from
# Hugging Face, widgets run on CPU torch, and myst-nb bakes the widget state
# into the published HTML. Committed notebooks stay small (no baked state);
# the interactive state exists only in the built pages.
name: widget docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/widget-docs.yml"
  workflow_dispatch:

# Builds and deploys the docs from `main`; the Pages URL follows repository
# ownership, so this workflow remains valid across an organization transfer.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: widget-docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/configure-pages@v6
      # Python deps must install BEFORE the frontend build: npm run build syncs
      # the WebGPU engine sources from quantem.gpu (scripts/sync-gpu-webgpu.mjs),
      # which imports quantem.gpu and its deps (numpy).
      - run: pip install -r docs/requirements.txt
      # .[hub] pulls quantem.data (widget_export tutorial); the loaders need
      # huggingface_hub + h5py + tifffile to download and read tutorial data.
      - run: pip install --extra-index-url https://test.pypi.org/simple/ -e ".[hub]" huggingface_hub h5py tifffile
      # The TestPyPI quantem.gpu release can lag the webgpu module the sync
      # script imports, so install quantem.gpu from its source tip instead
      # (the installed quantem package is regular, not namespace, so a
      # PYTHONPATH fallback cannot shadow a lagging site-packages release).
      - uses: actions/checkout@v7
        with:
          repository: bobleesj/quantem.gpu
          path: quantem-gpu-src
      - run: pip install ./quantem-gpu-src
      # The executed widgets load their JS from src/quantem/widget/static/,
      # which is a build artifact (gitignored) — build it before the notebooks run.
      - run: npm ci && npm run build
        env:
          QUANTEM_GPU_SRC: ${{ github.workspace }}/quantem-gpu-src/src
      # Cache the Hugging Face tutorial downloads across builds.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: docs-hf-tutorial-data-v1
      # Docs pages bake live widget state, so skip the saved-notebook static
      # preview sibling — it would render as a duplicate image under each widget.
      - run: jupyter-book build docs
        env:
          # Silence the "unauthenticated requests" warning that otherwise gets
          # baked into tutorial outputs on the published pages.
          HF_HUB_VERBOSITY: error
          QUANTEM_WIDGET_STATIC_FALLBACK: "0"
      # Theme-drift guard: a page with two primary-toggle buttons means the
      # mobile hamburger is dead (see scripts/check_docs_nav_toggle.py).
      - run: python scripts/check_docs_nav_toggle.py docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
