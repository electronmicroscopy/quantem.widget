# Build the quantem.widget Jupyter Book and publish it to GitHub Pages on the
# bobleesj fork. The runner EXECUTES the tutorial notebooks at build time
# (execute_notebooks: force in docs/_config.yml): tutorial data downloads from
# Hugging Face, widgets run on CPU torch, and myst-nb bakes the widget state
# into the published HTML. Committed notebooks stay small (no baked state);
# the interactive state exists only in the built pages.
name: widget docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/widget-docs.yml"
  workflow_dispatch:

# Origin-only. Builds + DEPLOYS the docs to GitHub Pages from this widget branch
# (it holds the live docs). The `github-pages` environment allowlist on
# bobleesj/quantem includes this branch, so the deploy is accepted; `main` is kept
# for when the work merges. Published at https://bobleesj.github.io/quantem/.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: widget-docs-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'bobleesj/quantem.widget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/configure-pages@v6
      # The executed widgets load their JS from src/quantem/widget/static/,
      # which is a build artifact (gitignored) — build it before the notebooks run.
      - run: npm ci && npm run build
      - run: pip install -r docs/requirements.txt
      # .[hub] pulls quantem.data (widget_export tutorial); the loaders need
      # huggingface_hub + h5py + tifffile to download and read tutorial data.
      - run: pip install --extra-index-url https://test.pypi.org/simple/ -e ".[hub]" huggingface_hub h5py tifffile
      # Cache the Hugging Face tutorial downloads across builds.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: docs-hf-tutorial-data-v1
      # Docs pages bake live widget state, so skip the saved-notebook static
      # preview sibling — it would render as a duplicate image under each widget.
      - run: jupyter-book build docs
        env:
          # Silence the "unauthenticated requests" warning that otherwise gets
          # baked into tutorial outputs on the published pages.
          HF_HUB_VERBOSITY: error
          QUANTEM_WIDGET_STATIC_FALLBACK: "0"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    # Publish from the active widget branch (its docs are the live ones); main kept for when it merges.
    # The github-pages environment allowlist includes this branch, so the deploy is accepted.
    if: github.repository == 'bobleesj/quantem.widget' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
