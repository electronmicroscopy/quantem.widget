name: quantem.diffsim release

# quantem.diffsim (packages/quantem.diffsim) is the browser build of DiffractionSim for web pages and
# Dash apps. It has no dependencies, so it is published to PyPI on its own, from a diffsim-vX.Y.Z tag.
# PyPI needs a trusted publisher for this repository, workflow and the "pypi" environment.

on:
  push:
    tags:
      - "diffsim-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: diffsim-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pypi:
    name: Build and publish quantem.diffsim
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check the tag against the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('packages/quantem.diffsim/pyproject.toml', 'rb'))['project']['version'])")
          test "diffsim-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }

      # the web-page bundle only, which needs no quantem.gpu sources (the widget bundles do)
      - name: Build the browser bundle
        run: |
          npm ci
          node scripts/build.mjs --web-only
          test -s packages/quantem.diffsim/src/quantem/diffsim/static/diffraction-sim.js

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build packages/quantem.diffsim --outdir dist/diffsim
          python -m twine check dist/diffsim/*

      - name: Check the wheel installs and serves the bundle
        run: |
          python -m pip install dist/diffsim/quantem_diffsim-*.whl ase
          python -c "import quantem.diffsim as d; from ase.build import bulk; assert d.bundle_path().stat().st_size > 500_000; assert 'quantem-diffsim-bundle' in d.html(bulk('Si', cubic=True))"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/diffsim/
