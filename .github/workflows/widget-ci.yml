name: widget ci

on:
  pull_request:
    paths:
      - ".github/workflows/widget-ci.yml"
      - "docs/**"
      - "gpu-ref.txt"
      - "js/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/widget-ci.yml"
      - "docs/**"
      - "gpu-ref.txt"
      - "js/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # the build and the sync test read the quantem.gpu checkout of gpu-ref.txt
      QUANTEM_GPU_SRC: ${{ github.workspace }}/quantem-gpu-src/src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://test.pypi.org/simple/ -e ".[test]"

      # quantem.gpu is optional for the widget at run time, but the bundles compile
      # its WebGPU sources (science kernels, borrowed-image contract), so the build
      # reads them from the ref in gpu-ref.txt (the same checkout widget-docs and
      # widget-release use).
      - name: Read the pinned quantem.gpu ref
        id: gpu
        run: echo "ref=$(cat gpu-ref.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: bobleesj/quantem.gpu
          ref: ${{ steps.gpu.outputs.ref }}
          path: quantem-gpu-src

      - name: Build frontend bundles
        run: |
          npm ci
          npm run build

      - name: Typecheck and unit-test the frontend
        run: |
          npx tsc --noEmit  # the build synced the quantem.gpu kernels; `npm run typecheck` would sync them again
          # Keep the multi-widget DOM mounts in a fresh process on small runners.
          # Both commands together run the complete suite, with unchanged timeouts.
          npx vitest run --maxWorkers=2 --exclude js/show3d/controls.test.ts
          npx vitest run js/show3d/controls.test.ts --maxWorkers=1

      - name: Size guards
        run: |
          python scripts/check_large_files.py
          python scripts/check_notebook_sizes.py

      - name: Test
        run: PYTHONPATH=src python -m pytest -q
