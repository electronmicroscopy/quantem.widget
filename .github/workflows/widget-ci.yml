name: widget ci

on:
  pull_request:
    paths:
      - ".github/workflows/widget-ci.yml"
      - "docs/**"
      - "js/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/widget-ci.yml"
      - "docs/**"
      - "js/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      signoff_mode:
        description: "Local signoff mode"
        type: choice
        default: default
        options:
          - default
          - quick
          - full
      browser:
        description: "Run exported HTML browser smoke"
        type: boolean
        default: false
      mobile:
        description: "Run 390x844 mobile Chromium pre-check with browser smoke"
        type: boolean
        default: false
      performance:
        description: "Run real-data export performance smoke"
        type: boolean
        default: false
      skip_docs:
        description: "Skip documentation build"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: widget-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          python -m pip install -e ".[test]"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run local signoff
        run: |
          args=(--artifact-dir /tmp/quantem-widget-ci-signoff)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.signoff_mode }}" in
              quick) args+=(--quick) ;;
              full) args+=(--full) ;;
            esac
            if [[ "${{ inputs.browser }}" == "true" || "${{ inputs.mobile }}" == "true" ]]; then
              args+=(--browser)
            fi
            if [[ "${{ inputs.mobile }}" == "true" ]]; then
              args+=(--mobile)
            fi
            if [[ "${{ inputs.performance }}" == "true" ]]; then
              args+=(--performance)
            fi
            if [[ "${{ inputs.skip_docs }}" == "true" ]]; then
              args+=(--skip-docs)
            fi
          fi
          scripts/widget_local_signoff.sh "${args[@]}"

      - name: Upload signoff report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: widget-ci-signoff
          path: /tmp/quantem-widget-ci-signoff
          if-no-files-found: warn
          retention-days: 14
