name: widget ci

on:
  pull_request:
    paths:
      - ".github/workflows/widget-ci.yml"
      - "docs/**"
      - "js/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/widget-ci.yml"
      - "docs/**"
      - "js/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://test.pypi.org/simple/ -e ".[test]"

      # quantem.gpu is optional for the widget, but the show4dstem and showptycho
      # bundles compile its WebGPU science kernels, so the build reads them from
      # its source tip (the same checkout widget-docs and widget-release use).
      - uses: actions/checkout@v7
        with:
          repository: bobleesj/quantem.gpu
          path: quantem-gpu-src

      - name: Build frontend bundles
        env:
          QUANTEM_GPU_SRC: ${{ github.workspace }}/quantem-gpu-src/src
        run: |
          npm ci
          npm run build

      - name: Size guards
        run: |
          python scripts/check_large_files.py
          python scripts/check_notebook_sizes.py

      - name: Test
        run: PYTHONPATH=src python -m pytest -q
